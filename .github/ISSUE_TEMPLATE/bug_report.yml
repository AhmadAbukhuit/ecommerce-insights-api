name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in the API or scripts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions, cURL commands, or Python code to reproduce the issue.
      placeholder: |
        1. Start the server via `docker compose up` or `uvicorn app.main:app`
        2. Make a request to `/metrics/category?category_name=XYZ`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Actual Output / Traceback
      description: Paste any error messages, stack traces, or logs here.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Execution Environment
      description: How are you running the application?
      options:
        - Docker Compose (`docker compose up`)
        - Docker Container (`docker run`)
        - Local Python Virtual Environment (`.venv`)
        - Other
    validations:
      required: true
  - type: input
    id: system_info
    attributes:
      label: OS & Python Version
      placeholder: e.g. Ubuntu 24.04, Python 3.12.3
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (report vulnerabilities via [SECURITY.md](SECURITY.md)).
          required: true
