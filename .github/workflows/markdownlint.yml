name: Markdown Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  markdownlint:
    name: Markdown Lint & Issue Management
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run Markdown Lint
        id: run_markdownlint
        run: |
          mkdir -p reports
          set +e
          markdownlint "**/*.md" > reports/markdownlint_report.txt 2>&1
          MD_EXIT=$?
          set -e
          cat reports/markdownlint_report.txt
          echo "exit_code=$MD_EXIT" >> $GITHUB_OUTPUT

      - name: Manage GitHub Issues based on Markdown Lint Results
        if: always() && steps.run_markdownlint.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MD_EXIT_CODE: ${{ steps.run_markdownlint.outputs.exit_code }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import sys

          exit_code = os.getenv("MD_EXIT_CODE", "0")
          commit_sha = os.getenv("COMMIT_SHA", "")
          ref_name = os.getenv("REF_NAME", "")
          event_name = os.getenv("EVENT_NAME", "")
          actor = os.getenv("ACTOR", "")
          run_id = os.getenv("RUN_ID", "")
          repo = os.getenv("REPO", "")

          report_path = "reports/markdownlint_report.txt"
          report_content = ""
          if os.path.exists(report_path):
              with open(report_path, "r", encoding="utf-8", errors="replace") as f:
                  report_content = f.read().strip()

          issue_title = "[Documentation] Markdown Lint Findings"

          def run_gh(cmd_list):
              try:
                  res = subprocess.run(["gh"] + cmd_list, capture_output=True, text=True, check=True)
                  return res.stdout.strip()
              except subprocess.CalledProcessError as e:
                  print(f"GH CLI warning/error: {e.stderr.strip() if e.stderr else e}")
                  return None

          # Search for existing open issue with this title
          find_cmd = [
              "issue", "list",
              "--state", "open",
              "--search", f"{issue_title} in:title",
              "--json", "number",
              "--jq", ".[0].number"
          ]
          existing_issue = run_gh(find_cmd)

          if exit_code != "0":
              print("Markdownlint detected formatting or syntax issues.")
              run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

              # Ensure labels exist (ignore errors if permissions/already exists)
              subprocess.run(["gh", "label", "create", "documentation", "--color", "0075ca"], capture_output=True)
              subprocess.run(["gh", "label", "create", "markdownlint", "--color", "bfd4f2"], capture_output=True)

              if existing_issue and existing_issue != "null":
                  print(f"Open issue #{existing_issue} already exists. Adding a comment with latest findings...")
                  comment_body = (
                      f"### 🔄 Markdown Lint Update\n\n"
                      f"Markdown issues were detected during workflow run for commit `{commit_sha}` "
                      f"(`{event_name}` on `{ref_name}` by @{actor}).\n\n"
                      f"<details open>\n<summary><b>Latest Lint Report</b></summary>\n\n"
                      f"```text\n{report_content}\n```\n\n"
                      f"</details>\n\n"
                      f"---\n*Action Run: [{run_id}]({run_url})*"
                  )
                  with open("comment.md", "w", encoding="utf-8") as f:
                      f.write(comment_body)
                  run_gh(["issue", "comment", existing_issue, "--body-file", "comment.md"])
              else:
                  print("No open issue found. Creating a new issue...")
                  issue_body = (
                      f"## ⚠️ Markdown Lint Issues Detected\n\n"
                      f"A linting check executed by the **Markdown Lint** workflow detected issues across project markdown files.\n\n"
                      f"- **Trigger:** `{event_name}`\n"
                      f"- **Branch/Ref:** `{ref_name}`\n"
                      f"- **Commit:** `{commit_sha}`\n"
                      f"- **Triggered by:** @{actor}\n\n"
                      f"### Lint Report\n\n"
                      f"<details open>\n<summary><b>Markdownlint Output</b></summary>\n\n"
                      f"```text\n{report_content}\n```\n\n"
                      f"</details>\n\n"
                      f"💡 *Tip: Check [.markdownlint.yaml](.markdownlint.yaml) for configured rules.*\n\n"
                      f"---\n"
                      f"*Automatically generated by [Markdown Lint Workflow]({run_url}).*"
                  )
                  with open("new_issue.md", "w", encoding="utf-8") as f:
                      f.write(issue_body)

                  create_res = run_gh([
                      "issue", "create",
                      "--title", issue_title,
                      "--body-file", "new_issue.md",
                      "--label", "documentation,markdownlint"
                  ])
                  if not create_res:
                      run_gh([
                          "issue", "create",
                          "--title", issue_title,
                          "--body-file", "new_issue.md"
                      ])

              # Fail the workflow step so CI indicates lint checks failed
              sys.exit(1)
          else:
              print("Markdown lint passed with no errors.")
              if existing_issue and existing_issue != "null":
                  print(f"Closing resolved issue #{existing_issue}...")
                  resolve_msg = (
                      f"✅ **Resolved:** All Markdown lint issues have been resolved as of commit `{commit_sha}`. "
                      f"Closing this issue automatically."
                  )
                  run_gh(["issue", "comment", existing_issue, "--body", resolve_msg])
                  run_gh(["issue", "close", existing_issue, "--reason", "completed"])
              else:
                  print("No existing open issue found to close.")
          EOF
